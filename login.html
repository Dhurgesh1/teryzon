<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/Horizons mini logo (1).png">
  <title>Connect | Teryzon</title>
  <style>
    :root { --black:#000; --ink:#f4eee9; --muted:#a89d96; --accent:#af533b; --line:#30221e; --panel:#0b0807; }
  * { box-sizing:border-box; } body { background:radial-gradient(circle at 50% 0,#25110c 0,#000 42%); color:var(--ink); font-family:"Trebuchet MS",Arial,sans-serif; line-height:1.6; margin:0; min-height:100vh; }
  a { color:var(--accent); text-decoration:none; } .shell { margin:0 auto; max-width:480px; padding:0 24px; } header { padding:34px 0; text-align:center; } header img { height:auto; max-width:230px; width:58vw; }
  main { padding:70px 0; } .eyebrow { color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; } h1 { font-size:clamp(3rem,8vw,5.5rem); letter-spacing:-.06em; line-height:1; margin:16px 0 10px; } p { color:var(--muted); }
  .auth-panel { border-top:1px solid var(--line); margin-top:38px; padding-top:26px; } label { color:var(--muted); display:block; font-size:.82rem; margin-bottom:18px; } .field { position:relative; } input { background:var(--panel); border:1px solid var(--line); color:var(--ink); font:inherit; margin-top:7px; padding:13px; width:100%; } .password-input { padding-right:58px; }
  .show-password { background:transparent; border:0; bottom:12px; color:var(--accent); cursor:pointer; font:inherit; padding:0; position:absolute; right:12px; } .form-row { align-items:center; display:flex; justify-content:space-between; margin:2px 0 22px; } .remember { align-items:center; display:flex; font-size:.8rem; gap:8px; margin:0; } .remember input { accent-color:var(--accent); margin:0; padding:0; width:auto; } .forgot { font-size:.8rem; }
  .button { background:var(--accent); border:0; color:var(--black); cursor:pointer; font:inherit; font-weight:700; padding:13px 18px; width:100%; } .google-button { align-items:center; background:transparent; border:1px solid var(--line); color:var(--ink); display:flex; gap:12px; justify-content:center; margin-top:12px; } .google-mark { display:block; height:22px; object-fit:contain; width:22px; }
  .divider { align-items:center; color:var(--muted); display:flex; font-size:.75rem; gap:12px; margin:22px 0 10px; } .divider:before, .divider:after { background:var(--line); content:""; flex:1; height:1px; } .auth-status { color:var(--accent); font-size:.85rem; min-height:1.5em; } .auth-switch, .consent { font-size:.8rem; text-align:center; } .consent { line-height:1.5; margin-top:24px; }
  body { background:radial-gradient(circle at 0 50%,#25110c 0,rgba(0,0,0,0) 38%),radial-gradient(circle at 100% 50%,#25110c 0,rgba(0,0,0,0) 38%),#000 !important; }
  button { border-radius:999px; }
  </style>
</head>
<body>
  <header><a href="index.html"><img src="images/Horizons logo (1).png" alt="Horizons"></a></header>
  <main><div class="shell">
    <p class="eyebrow">Teryzon connection</p><h1>Welcome back.</h1><p>Sign in to continue your Teryzon journey.</p>
    <div class="auth-panel"><form id="login-form">
      <label>Email address<input name="email" type="email" autocomplete="email" required></label>
      <label class="field">Password<input class="password-input" id="password" name="password" type="password" autocomplete="current-password" required><button class="show-password" id="show-password" type="button">Show</button></label>
  <div class="form-row"><label class="remember"><input name="remember" type="checkbox"> Remember me</label><a class="forgot" href="forgot-password.html">Forgot password?</a></div>
  <button class="button" type="submit">Sign in to Teryzon</button>
  <div class="divider"><span>or continue with</span></div>
      <button class="button google-button" id="google-login" type="button"><img class="google-mark" src="images/google-loo-real.png" alt="Google"> Continue with Google</button>
      <p class="auth-status" id="auth-status" aria-live="polite"></p>
    </form><p class="auth-switch">Don't have a Teryzon account? <a href="signup.html">Create one</a></p><p class="consent">By continuing, you agree to Teryzon's <a href="terms-of-service.html">Terms of Service</a> and <a href="privacy-policy.html">Privacy Policy</a>.</p></div>
  </div></main>
  <script>
    const loginForm = document.querySelector('#login-form'); const status = document.querySelector('#auth-status'); const password = document.querySelector('#password'); const showPassword = document.querySelector('#show-password');
  showPassword.addEventListener('click', () => { const visible = password.type === 'text'; password.type = visible ? 'password' : 'text'; showPassword.textContent = visible ? 'Show' : 'Hide'; });
  loginForm.addEventListener('submit', (event) => { event.preventDefault(); localStorage.setItem('teryzonLoggedIn', 'true'); localStorage.setItem('teryzonUser', loginForm.email.value); window.location.href = 'dashboard.html'; });
  document.querySelector('#google-login').addEventListener('click', () => { status.textContent = 'Google sign-in will be connected here soon.'; });
  </script>
</body>
</html>
