<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/Horizons mini logo (1).png">
  <script src="assets/js/theme-early.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <title>Reset password | Teryzon</title>
  <style>
    :root { --black:#000; --ink:#f4eee9; --muted:#a89d96; --accent:#af533b; --line:#30221e; --panel:#0b0807; }
    * { box-sizing:border-box; } body { background:radial-gradient(circle at 50% 0,#25110c 0,#000 42%); color:var(--ink); font-family:"Trebuchet MS",Arial,sans-serif; line-height:1.6; margin:0; min-height:100vh; }
    a { color:var(--accent); text-decoration:none; } .shell { margin:0 auto; max-width:480px; padding:0 24px; } header { padding:34px 0; text-align:center; } header img { height:auto; max-width:230px; width:58vw; }
    main { padding:70px 0; } .eyebrow { color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; } h1 { font-size:clamp(3rem,8vw,5.5rem); letter-spacing:-.06em; line-height:1; margin:16px 0 10px; } p { color:var(--muted); }
    .auth-panel { border-top:1px solid var(--line); margin-top:38px; padding-top:26px; } label { color:var(--muted); display:block; font-size:.82rem; margin-bottom:18px; } input { background:var(--panel); border:1px solid var(--line); color:var(--ink); font:inherit; margin-top:7px; padding:13px; width:100%; } .button { background:var(--accent); border:0; color:var(--black); cursor:pointer; font:inherit; font-weight:700; padding:13px 18px; width:100%; } .auth-status { color:var(--accent); font-size:.85rem; min-height:1.5em; } .auth-switch { font-size:.85rem; text-align:center; }
    body { background:radial-gradient(circle at 0 50%,#25110c 0,rgba(0,0,0,0) 38%),radial-gradient(circle at 100% 50%,#25110c 0,rgba(0,0,0,0) 38%),#000 !important; }
    button { border-radius:999px; }
    .auth-status { background:var(--panel); border:1px solid var(--accent); border-radius:12px; color:var(--ink); margin:16px 0 0; min-height:0; padding:12px 14px; }
    .auth-status:empty { display:none; }
  </style>
</head>
  <header><a href="/"><img src="images/Horizons logo (1).png" alt="Horizons"></a></header>
  <main><div class="shell"><p class="eyebrow">Account recovery</p><h1>Reset your password.</h1><p>Enter your email and we will send reset instructions when account email is connected.</p><div class="auth-panel"><form id="reset-form"><label>Email address<input name="email" type="email" autocomplete="email" required></label><button class="button" type="submit">Send reset instructions</button><p class="auth-status" id="auth-status" aria-live="polite"></p></form><p class="auth-switch"><a href="/login">Back to sign in</a></p></div></div></main>
  <script type="module">import './assets/js/theme.js';import { isSupabaseConfigured, showAuthError, SITE_URL, supabase } from './assets/js/supabase-auth.js';document.querySelector('#reset-form').addEventListener('submit',async(event)=>{event.preventDefault();const status=document.querySelector('#auth-status');status.textContent='Sending reset instructions...';if(!isSupabaseConfigured){status.textContent='Supabase is not configured. Add your project URL and publishable key first.';return;}try{const { error }=await supabase.auth.resetPasswordForEmail(event.currentTarget.email.value.trim(),{redirectTo:`${SITE_URL}/reset-password`});if(error)showAuthError(status,error);else status.textContent='Email sent. Check your inbox and spam folder for password reset instructions.';}catch(error){showAuthError(status,error);}});</script>
</body>
</html>
