<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/Horizons mini logo (1).png">
  <script src="assets/js/theme-early.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <title>Choose a new password | Teryzon</title>
  <style>
    :root { --black:#000; --ink:#f4eee9; --muted:#a89d96; --accent:#af533b; --line:#30221e; --panel:#0b0807; }
    * { box-sizing:border-box; } body { background:radial-gradient(circle at 0 50%,#25110c 0,rgba(0,0,0,0) 38%),radial-gradient(circle at 100% 50%,#25110c 0,rgba(0,0,0,0) 38%),#000; color:var(--ink); font-family:"Trebuchet MS",Arial,sans-serif; line-height:1.6; margin:0; min-height:100vh; }
    a { color:var(--accent); text-decoration:none; } .shell { margin:0 auto; max-width:480px; padding:0 24px; } header { padding:34px 0; text-align:center; } header img { height:auto; max-width:230px; width:58vw; }
    main { padding:70px 0; } .eyebrow { color:var(--accent); font-size:.72rem; font-weight:700; letter-spacing:.16em; text-transform:uppercase; } h1 { font-size:clamp(3rem,8vw,5.5rem); letter-spacing:-.06em; line-height:1; margin:16px 0 10px; } p { color:var(--muted); }
    .auth-panel { border-top:1px solid var(--line); margin-top:38px; padding-top:26px; } label { color:var(--muted); display:block; font-size:.82rem; margin-bottom:18px; } input { background:var(--panel); border:1px solid var(--line); color:var(--ink); font:inherit; margin-top:7px; padding:13px; width:100%; } .button { background:var(--accent); border:0; color:var(--black); cursor:pointer; font:inherit; font-weight:700; padding:13px 18px; width:100%; } .auth-status { background:var(--panel); border:1px solid var(--accent); border-radius:12px; color:var(--ink); margin:16px 0 0; padding:12px 14px; } .auth-status:empty { display:none; } button { border-radius:999px; }
  </style>
</head>
<body>
  <header><a href="index.html"><img src="images/Horizons logo (1).png" alt="Horizons"></a></header>
  <main><div class="shell">
    <p class="eyebrow">Account recovery</p><h1>Choose a new password.</h1><p>Set a new password for your Teryzon account.</p>
    <div class="auth-panel"><form id="reset-password-form">
      <label>New password<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
      <label>Confirm new password<input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></label>
      <button class="button" type="submit">Update password</button>
      <p class="auth-status" id="auth-status" role="status" aria-live="polite"></p>
    </form></div>
  </div></main>
  <script type="module">
    import './assets/js/theme.js';
    import { showAuthError, SITE_URL, supabase } from './assets/js/supabase-auth.js';

    const form = document.querySelector('#reset-password-form');
    const status = document.querySelector('#auth-status');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const password = form.password.value;
      const confirmPassword = form.confirmPassword.value;
      if (password !== confirmPassword) {
        status.textContent = 'Passwords do not match.';
        return;
      }
      status.textContent = 'Updating your password...';
      const button = form.querySelector('button[type="submit"]');
      button.disabled = true;
      try {
        const { error } = await supabase.auth.updateUser({ password });
        if (error) throw error;
        status.textContent = 'Password updated. Returning to sign in...';
        window.setTimeout(() => window.location.replace(`${SITE_URL}/login.html`), 700);
      } catch (error) {
        button.disabled = false;
        showAuthError(status, error);
      }
    });
  </script>
</body>
</html>
