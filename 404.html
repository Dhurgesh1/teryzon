<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="/images/Horizons mini logo (1).png?v=4">
  <script src="/assets/js/theme-early.js"></script>
  <link rel="stylesheet" href="/assets/css/theme.css">
  <title>Page not found | Teryzon</title>
  <style>
    :root { --black:#000; --ink:#f4eee9; --muted:#a89d96; --accent:#af533b; --line:#30221e; --panel:#0b0807; }
    * { box-sizing:border-box; }
    body { align-items:center; background:radial-gradient(circle at 12% 18%,#25110c 0,rgba(0,0,0,0) 35%),radial-gradient(circle at 88% 82%,#25110c 0,rgba(0,0,0,0) 35%),#000; color:var(--ink); display:flex; font-family:"Trebuchet MS",Arial,sans-serif; justify-content:center; margin:0; min-height:100vh; }
    .shell { max-width:820px; padding:40px 32px; width:100%; }
    .brand { color:var(--ink); display:block; font-size:.78rem; font-weight:700; letter-spacing:.18em; position:fixed; right:40px; text-decoration:none; text-transform:uppercase; top:32px; z-index:2; }
    .brand img { display:block; height:auto; max-width:210px; width:24vw; }
    .code { color:var(--accent); font-size:.82rem; font-weight:700; letter-spacing:.24em; text-transform:uppercase; }
    h1 { font-size:clamp(5rem,16vw,11rem); letter-spacing:-.09em; line-height:.82; margin:22px 0 34px; max-width:780px; }
    h1 em { color:var(--accent); font-style:normal; }
    p { color:var(--muted); font-size:1.08rem; line-height:1.75; margin:0 0 36px; max-width:500px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; }
    .button { border:1px solid var(--accent); border-radius:999px; color:var(--ink); display:inline-flex; font-weight:700; padding:13px 20px; text-decoration:none; }
    .button-primary { background:var(--accent); color:var(--black); }
    .button:hover { transform:translateY(-1px); }
    @media (max-width:520px) { .shell { padding:28px 24px; } .brand { right:24px; top:24px; } .brand img { width:34vw; } h1 { margin-top:112px; font-size:clamp(4.5rem,22vw,7rem); } .actions { align-items:stretch; flex-direction:column; } .button { justify-content:center; } }
  </style>
  <link rel="stylesheet" href="/assets/css/chatbot.css">
  <script src="/assets/js/chatbot.js" defer></script>
</head>
<body>
  <main class="shell">
    <a class="brand" href="/"><img src="/images/Horizons logo (1).png" alt="Teryzon"></a>
    <div class="code">Error 404</div>
    <h1>Ground not <em>found.</em></h1>
    <p>The page you are looking for has moved, gone deeper, or never existed. Let us get you back to Teryzon.</p>
    <div class="actions">
      <a class="button button-primary" href="/">Back to home</a>
      <a class="button" href="javascript:history.back()">Go back</a>
    </div>
  </main>
  <script>
    const routes = {
      '/accessibility': 'accessibility.html',
      '/auth-callback': 'auth-callback.html',
      '/cookie-policy': 'cookie-policy.html',
      '/dashboard': 'dashboard.html',
      '/download': 'download.html',
      '/forgot-password': 'forgot-password.html',
      '/login': 'login.html',
      '/privacy-policy': 'privacy-policy.html',
      '/reset-password': 'reset-password.html',
      '/signup': 'signup.html',
      '/terms-of-service': 'terms-of-service.html'
    };

    const route = routes[window.location.pathname.replace(/\/$/, '')];
    if (route) {
      fetch(`/${route}`)
        .then((response) => {
          if (!response.ok) throw new Error('Page not found');
          return response.text();
        })
        .then((html) => {
          document.open();
          document.write(html);
          document.close();
        })
        .catch(() => { document.querySelector('.code').textContent = 'Error 404'; });
    }
  </script>
</body>
</html>
