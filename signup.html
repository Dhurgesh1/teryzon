<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <link rel="icon" type="image/png" href="images/Horizons mini logo (1).png">
  <script src="assets/js/theme-early.js"></script>
  <link rel="stylesheet" href="assets/css/theme.css">
  <title>Sign up | Teryzon</title>
  <style>
    :root{--black:#000;--ink:#f4eee9;--muted:#a89d96;--accent:#af533b;--line:#30221e;--panel:#0b0807}*{box-sizing:border-box}body{background:radial-gradient(circle at 0 50%,#25110c 0,rgba(0,0,0,0) 38%),radial-gradient(circle at 100% 50%,#25110c 0,rgba(0,0,0,0) 38%),#000;color:var(--ink);font-family:"Trebuchet MS",Arial,sans-serif;line-height:1.6;margin:0;min-height:100vh}a{color:var(--accent);text-decoration:none}.shell{margin:0 auto;max-width:480px;padding:0 24px}header{padding:34px 0;text-align:center}header img{height:auto;max-width:230px;width:58vw}main{padding:70px 0}.eyebrow{color:var(--accent);font-size:.72rem;font-weight:700;letter-spacing:.16em;text-transform:uppercase}h1{font-size:clamp(3rem,8vw,5.5rem);letter-spacing:-.06em;line-height:1;margin:16px 0 10px}p{color:var(--muted)}.auth-panel{border-top:1px solid var(--line);margin-top:38px;padding-top:26px}label{color:var(--muted);display:block;font-size:.82rem;margin-bottom:18px}.field{position:relative}input{background:var(--panel);border:1px solid var(--line);color:var(--ink);font:inherit;margin-top:7px;padding:13px;width:100%}.password-input{padding-right:58px}.show-password{background:transparent;border:0;bottom:12px;color:var(--accent);cursor:pointer;font:inherit;padding:0;position:absolute;right:12px}.button{background:var(--accent);border:0;border-radius:999px;color:var(--black);cursor:pointer;font:inherit;font-weight:700;padding:13px 18px;width:100%}.google-button{align-items:center;background:transparent;border:1px solid var(--line);color:var(--ink);display:flex;gap:12px;justify-content:center;margin-top:12px}.google-mark{display:block;height:22px;object-fit:contain;width:22px}.divider{align-items:center;color:var(--muted);display:flex;font-size:.75rem;gap:12px;margin:22px 0 10px}.divider:before,.divider:after{background:var(--line);content:"";flex:1;height:1px}.auth-status{background:var(--panel);border:1px solid var(--accent);border-radius:12px;color:var(--ink);font-size:.85rem;margin:16px 0 0;min-height:0;padding:12px 14px}.auth-status:empty{display:none}.auth-switch,.consent{font-size:.8rem;text-align:center}.consent{line-height:1.5;margin-top:24px}
  </style>
</head>
<body><header><a href="/"><img src="images/Horizons logo (1).png" alt="Horizons"></a></header><main><div class="shell"><p class="eyebrow">Start exploring</p><h1>Create your account.</h1><p>Sign up to continue your Teryzon journey.</p><div class="auth-panel"><form id="signup-form"><label>Name<input name="name" type="text" autocomplete="name" required></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label class="field">Password<input class="password-input" id="password" name="password" type="password" autocomplete="new-password" minlength="8" required><button class="show-password" id="show-password" type="button">Show</button></label><button class="button" type="submit">Create account</button><div class="divider"><span>or continue with</span></div><button class="button google-button" id="google-signup" type="button"><img class="google-mark" src="images/google-loo-real.png" alt="Google"> Continue with Google</button><p class="auth-status" id="auth-status" role="alert" aria-live="polite"></p></form><p class="auth-switch">Already have a Teryzon account? <a href="/login">Sign in</a></p><p class="consent">By continuing, you agree to Teryzon's <a href="/terms-of-service">Terms of Service</a> and <a href="/privacy-policy">Privacy Policy</a>.</p></div></div></main><script type="module">
    import './assets/js/theme.js';
    import { isSupabaseConfigured, showAuthError, AUTH_CALLBACK_URL, supabase } from './assets/js/supabase-auth.js';
    const signupForm=document.querySelector('#signup-form'); const password=document.querySelector('#password'); const showPassword=document.querySelector('#show-password'); const status=document.querySelector('#auth-status');
    showPassword.addEventListener('click',()=>{const visible=password.type==='text';password.type=visible?'password':'text';showPassword.textContent=visible?'Show':'Hide';});
    signupForm.addEventListener('submit',async(event)=>{event.preventDefault();status.textContent='Creating your account...';if(!isSupabaseConfigured){status.textContent='Supabase is not configured. Add your project URL and publishable key first.';return;}try{const {data,error}=await supabase.auth.signUp({email:signupForm.email.value.trim(),password:signupForm.password.value,options:{data:{full_name:signupForm.name.value.trim()},emailRedirectTo:AUTH_CALLBACK_URL}});if(error){showAuthError(status,error);return;}if(data.session){status.textContent='Account created. Opening your dashboard...';window.location.href='/dashboard';}else status.textContent='Account created. Check your email to confirm your account, then sign in.';}catch(error){showAuthError(status,error);}});
    document.querySelector('#google-signup').addEventListener('click',async()=>{status.textContent='Connecting to Google...';if(!isSupabaseConfigured){status.textContent='Supabase is not configured. Add your project URL and publishable key first.';return;}try{const {error}=await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:AUTH_CALLBACK_URL}});if(error)showAuthError(status,error);}catch(error){showAuthError(status,error);}});
  </script></body>
</html>
